when:
  - event: push
    branch: master
  - event: pull_request
  - event: tag

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

steps:
  root-fmt:
    image: golang:1.27
    commands:
      - |
        fmt_out=$(gofmt -l . 2>/dev/null)
        if [ -n "$fmt_out" ]; then
          echo "The following files need gofmt:"
          echo "$fmt_out"
          exit 1
        fi

  root-vet:
    image: golang:1.27
    environment:
      GOCACHE: /tmp/.gocache
    commands:
      - go vet ./...

  root-test:
    image: golang:1.27
    environment:
      GOCACHE: /tmp/.gocache
    commands:
      - go test -race ./...

  root-lint:
    image: golang:1.27
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      GOCACHE: /tmp/.gocache
    commands:
      # Installing on the same Go image guarantees a golangci-lint binary
      # built for the exact toolchain version the other steps use.
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - /go/bin/golangci-lint run

  fyne-vet:
    image: golang:1.27
    environment:
      GOCACHE: /tmp/.gocache
    commands:
      - cd ui/fyne && go vet ./...

  fyne-test:
    image: golang:1.27
    environment:
      GOCACHE: /tmp/.gocache
    commands:
      # Plain `go test` is the mandatory gate for the Fyne module. The race
      # detector is intentionally not run module-wide: Fyne GUI-interaction
      # tests are unstable under it. Pure formatting/loading/policy tests run
      # under -race locally instead.
      - cd ui/fyne && go test ./...

  fyne-lint:
    image: golang:1.27
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      GOCACHE: /tmp/.gocache
    commands:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - cd ui/fyne && /go/bin/golangci-lint run --config ../../golangci.yml
